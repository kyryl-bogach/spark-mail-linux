# Wine renders Spark's tray icon as a small floating tile when the session has
# no StatusNotifierWatcher. This rule moves that tile out of sight.
# The window has class "explorer.exe" and an empty title.
windowrulev2 = workspace special:spark-tray silent, class:^(explorer\.exe)$, title:^$
windowrulev2 = noinitialfocus, class:^(explorer\.exe)$, title:^$
