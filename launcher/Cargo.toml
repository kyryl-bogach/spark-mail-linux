[package]
name = "spark-arm"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "Launch Spark Desktop on aarch64 Linux through muvm, FEX-Emu and Wine"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.9", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"

[profile.release]
strip = true
